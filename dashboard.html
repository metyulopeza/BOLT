<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolt - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="app-header">
    <div class="brand">
      <h1 class="logo-text">Bolt</h1>
      <span class="sub-logo">Centro de Servicios Financieros</span>
    </div>

    <form class="search-bar" role="search">
      <label for="buscar" class="sr-only">Buscar ambiente o solicitud</label>
      <input type="search" id="buscar" placeholder="Buscar ambiente o solicitud (ej. 402 / #104)">
    </form>

    <div class="user-profile">
      <button type="button" class="icon-btn" id="btn-notif" aria-label="Ver notificaciones">
        <span aria-hidden="true">🔔</span><span class="badge" id="notif-count">0</span>
      </button>
      <div class="avatar" id="user-avatar" aria-hidden="true">--</div>
      <div class="user-info">
        <span class="user-name" id="display-username">Cargando...</span>
        <span class="user-role" id="display-role">Rol</span>
      </div>
      <button type="button" id="btn-logout" class="btn-sm btn-logout">Salir</button>
    </div>
  </header>

  <div class="layout-container">
    <aside class="sidebar">
      <nav aria-label="Menú principal"><ul id="sidebar-menu"></ul></nav>
    </aside>
    <main id="contenido" class="main-content" tabindex="-1"></main>
  </div>

  <footer class="app-footer">Bolt · Proyecto formativo SENA</footer>

  <p id="resultados" class="sr-only" aria-live="polite"></p>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg" aria-labelledby="dlg-title"></dialog>

  <script src="script.js"></script>
</body>
</html>
