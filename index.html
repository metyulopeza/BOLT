<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bolt - Iniciar Sesión</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <main class="login-card">
    <div class="login-header">
      <h1 class="logo-text">Bolt</h1>
      <p class="subtitle">Centro de Servicios Financieros - SENA</p>
    </div>

    <form id="form-login" novalidate>
      <div class="form-group">
        <label for="email">Correo Institucional *</label>
        <input type="email" id="email" placeholder="usuario@sena.edu.co" required>
        <span class="error-message" id="error-email"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" placeholder="••••••••" required>
        <span class="error-message" id="error-password"></span>
      </div>

      <div class="form-group">
        <label for="role-select">Rol de Ingreso *</label>
        <select id="role-select" required>
          <option value="Instructor">Instructor</option>
          <option value="TIC">Soporte TIC / Seguridad</option>
          <option value="Administrador">Administrador</option>
        </select>
      </div>

      <button type="submit" class="btn btn-login">Ingresar al Sistema</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
