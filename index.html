<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>BOLT</title>
</head>
<body>
        <div id="registro" class="target">
            <h1>Registro de usuario</h1>     
            <form action="">
                <P><label for="nombre"> Nombre:</label><input type="text" id="nombre"></P>
                <P><label for="apellido"> Apellido:</label><input type="text" id="apellido"></P>
                <P><label for="edad"> Edad:</label><input type="text"></P>
                <P><label for="telefono"> Telefono:<input type="text" id="telefono"></label></P>

                <button type="submit">Registrarse</button>
            </form>
        </div>

        <div>
            <h1>Registrar una Novedad</h1>
            <form action="">
                <p><label for="instructor">Nombre del Instructor: <input type="text" id="Instructor"></label></p>
                <p><label for="ambiente">Numero de Ambiente: <input type="text" id="n_ambiente"></label></p>
                <p><label for="personal">Que personal solicita:<input type="text"id="personal"></label></p>
                <p><label for="servicio">Que servicio necesita: <input type="text" id="servicio"></label></p>
                <p><label for="observacion">¿Cuenta con alguna observacion?: <textarea id="observacion"></textarea></label></p>


                <button type="submit">Enviar Novedad</button>
            </form>

        </div>




    <script src="script.js"></script>
</body>
</html>
